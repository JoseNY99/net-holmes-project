# Configuración Nginx para netholmes.tech (NetHolmes Platform)
# Ubicación en VPS: /etc/nginx/sites-available/netholmes.tech
# Activar con: sudo ln -s /etc/nginx/sites-available/netholmes.tech /etc/nginx/sites-enabled/
# Certificado SSL con: sudo certbot --nginx -d netholmes.tech -d www.netholmes.tech

server {
    listen 80;
    listen [::]:80;
    server_name netholmes.tech www.netholmes.tech;

    # Headers de Seguridad OPSEC y Anti-Indexing
    add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Frontend estático (Vite build)
    root /var/www/operativa/frontend/dist;
    index index.html;

    # Bloqueo explícito de robots.txt
    location = /robots.txt {
        add_header Content-Type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    # API Backend (FastAPI / Uvicorn)
    location /api/ {
        proxy_pass http://127.0.0.1:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
    }

    # Archivos estáticos de backend (evidencias, screenshots)
    location /static/ {
        proxy_pass http://127.0.0.1:8000/static/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Webhook de WhatsApp Cloud API
    location /webhook {
        proxy_pass http://127.0.0.1:8000/webhook;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA Routing (React Router)
    location / {
        try_files $uri $uri/ /index.html;
    }

    client_max_body_size 50M;
}